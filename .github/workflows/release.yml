name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mira

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon — the long-term primary macOS target.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: mira-darwin-arm64.tar.gz
          # x86_64 Mac — `macos-13` was retired Dec 2025. `macos-15-intel`
          # is the current Intel runner. GitHub plans to retire x86_64
          # macOS entirely around Fall 2027; treat this as a transitional
          # target and bias new work toward arm64.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: mira-darwin-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: mira-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: mira-linux-arm64.tar.gz
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/mira-server/frontend/package-lock.json

      - name: Build frontend
        working-directory: crates/mira-server/frontend
        run: |
          npm ci
          npm run build

      - name: Install cross linker (Linux arm64)
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure cross linker
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "${{ matrix.linker }}"
          EOF

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p mira-cli

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${staging}/${BIN_NAME}"
          cp README.md LICENSE "${staging}/"
          tar -C "${staging}" -czf "${{ matrix.asset }}" .
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mira-*.tar.gz
            dist/mira-*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  update-homebrew-tap:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Read checksums
        id: shas
        run: |
          echo "darwin_arm64=$(cat dist/mira-darwin-arm64.tar.gz.sha256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_x86_64=$(cat dist/mira-darwin-x86_64.tar.gz.sha256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(cat dist/mira-linux-arm64.tar.gz.sha256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(cat dist/mira-linux-x86_64.tar.gz.sha256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Clone homebrew-tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/runmira/homebrew-tap.git tap

      - name: Update formula
        run: |
          VERSION="${{ steps.shas.outputs.version }}"
          FORMULA="tap/Formula/mira.rb"

          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" "$FORMULA"

          # Update each sha256 by matching the URL line that precedes it
          python3 - <<'EOF'
          import re, os

          version  = os.environ['VERSION']
          shas = {
            'mira-darwin-arm64.tar.gz':   os.environ['DARWIN_ARM64'],
            'mira-darwin-x86_64.tar.gz':  os.environ['DARWIN_X86_64'],
            'mira-linux-arm64.tar.gz':    os.environ['LINUX_ARM64'],
            'mira-linux-x86_64.tar.gz':   os.environ['LINUX_X86_64'],
          }

          with open('tap/Formula/mira.rb') as f:
            content = f.read()

          for asset, sha in shas.items():
            # Replace the sha256 line that immediately follows the URL containing this asset
            content = re.sub(
              r'(url "[^"]*' + re.escape(asset) + r'[^"]*"\n\s+)sha256 "[a-f0-9]+"',
              lambda m, s=sha: m.group(1) + f'sha256 "{s}"',
              content,
            )

          with open('tap/Formula/mira.rb', 'w') as f:
            f.write(content)
          EOF
        env:
          VERSION:      ${{ steps.shas.outputs.version }}
          DARWIN_ARM64: ${{ steps.shas.outputs.darwin_arm64 }}
          DARWIN_X86_64: ${{ steps.shas.outputs.darwin_x86_64 }}
          LINUX_ARM64:  ${{ steps.shas.outputs.linux_arm64 }}
          LINUX_X86_64: ${{ steps.shas.outputs.linux_x86_64 }}

      - name: Commit and push
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mira.rb
          git commit -m "mira ${{ steps.shas.outputs.version }}"
          git push
