name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

  web:
    name: web UI (build · bundle budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mira-server/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mira-server/frontend/package-lock.json

      - run: npm ci

      - name: build
        run: npm run build

      # Fails when the first-load JS grows past the budget (issue #72).
      # `npm run analyze` locally writes dist/stats.html to see why.
      - name: bundle budget
        run: npm run size

  supabase:
    name: supabase (migrations · remote-access tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      # Every migration, in order, on a disposable database with stand-ins
      # for Supabase's auth schema and roles; then the SQL tests.
      - name: migrations + SQL tests
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stubs.sql
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/remote_tunnel_slots.sql

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mira-server/frontend/package-lock.json

      - name: install (for TypeScript)
        working-directory: crates/mira-server/frontend
        run: npm ci

      - name: remote-access function + pairing tests
        run: node supabase/tests/remote-access.cjs

  desktop:
    name: desktop app (fmt · clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      # The bundler checks the sidecar exists; the real one is staged by
      # scripts/build-desktop.sh.
      - name: Stub the sidecar
        run: |
          touch "binaries/mira-$(rustc -vV | sed -n 's/^host: //p')"

      - name: rustfmt
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
