name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

  web:
    name: web UI (build · bundle budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mira-server/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mira-server/frontend/package-lock.json

      - run: npm ci

      - name: build
        run: npm run build

      # Fails when the first-load JS grows past the budget (issue #72).
      # `npm run analyze` locally writes dist/stats.html to see why.
      - name: bundle budget
        run: npm run size

  desktop:
    name: desktop app (fmt · clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      # The bundler checks the sidecar exists; the real one is staged by
      # scripts/build-desktop.sh.
      - name: Stub the sidecar
        run: |
          touch "binaries/mira-$(rustc -vV | sed -n 's/^host: //p')"

      - name: rustfmt
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
