name: python-bug
prompt: |
  The tests in `test_paging.py` fail. Find the bugs in `paging.py` and fix them
  so `python3 -m unittest` passes. Don't change the tests.
fixture: 07-python-bug-fixture
verify: python3 -m unittest -q 2>&1 && git diff --no-index --quiet "$EVAL_FIXTURE/test_paging.py" test_paging.py
timeout_secs: 240
