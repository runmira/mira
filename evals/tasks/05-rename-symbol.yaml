name: rename-symbol
prompt: |
  In the current directory, there is a Rust library with a function named `get` that looks up configuration values.
  Rename this function to `lookup` while maintaining the same functionality. Update all usages of the function
  throughout the codebase.
fixture: 05-rename-symbol-fixture
# The test calls `lookup`; any `get(` left in src means a usage was missed.
verify: cargo test --quiet && ! grep -n 'fn get(\|\.get("' src/lib.rs
timeout_secs: 300