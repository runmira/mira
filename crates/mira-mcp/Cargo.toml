[package]
name         = "mira-mcp"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
description  = "Model Context Protocol client for Mira: live server connections, OAuth, and MCP tools."

[dependencies]
mira-ai     = { workspace = true }
mira-auth   = { workspace = true }
mira-config = { workspace = true }
mira-core   = { workspace = true }
mira-tools  = { workspace = true }

anyhow       = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
reqwest      = { workspace = true }
# rmcp's HTTP client type (its `AuthClient` wraps this version).
reqwest013   = { package = "reqwest", version = "0.13", default-features = false }
rmcp         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
tracing      = { workspace = true }
eventsource-stream = { workspace = true }
sha2         = "0.10"
url          = "2"

[dev-dependencies]
mira-sandbox = { workspace = true }
axum     = { workspace = true }
tempfile = "3"
