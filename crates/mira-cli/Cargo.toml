[package]
name         = "mira-cli"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
description  = "Terminal entrypoint for the Mira coding agent."
default-run  = "mira"

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
mira-core     = { workspace = true }
mira-config   = { workspace = true }
mira-ai       = { workspace = true }
mira-tools    = { workspace = true }
mira-memory   = { workspace = true }
mira-policy   = { workspace = true }
mira-sandbox  = { workspace = true }
mira-harness  = { workspace = true }
mira-review   = { workspace = true }
mira-skills   = { workspace = true }
mira-server   = { workspace = true }

async-trait        = { workspace = true }
tokio              = { workspace = true }
futures            = { workspace = true }
clap               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

ratatui       = { workspace = true }
crossterm     = { workspace = true }
unicode-width = { workspace = true }
similar       = { workspace = true }
regex         = { workspace = true }
tempfile      = "3"
