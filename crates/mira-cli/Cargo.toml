[package]
name         = "mira-cli"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
description  = "Terminal entrypoint for the Mira coding agent."
default-run  = "mira"

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
mira-core     = { workspace = true }
mira-config   = { workspace = true }
mira-ai       = { workspace = true }
mira-tools    = { workspace = true }
mira-memory   = { workspace = true }
mira-policy   = { workspace = true }
mira-computer = { workspace = true }
mira-compute  = { workspace = true }
mira-cloud    = { workspace = true }
shellexpand   = { workspace = true }
mira-browser  = { workspace = true }
mira-sandbox  = { workspace = true }
mira-harness  = { workspace = true }
mira-review   = { workspace = true }
mira-skills   = { workspace = true }
mira-server   = { workspace = true }
mira-mcp     = { workspace = true }
mira-plugins = { workspace = true }
mira-auth     = { workspace = true }
mira-agents   = { workspace = true }

async-trait        = { workspace = true }
tokio              = { workspace = true }
reqwest            = { workspace = true }
# Slack Socket Mode (wss).
tokio-tungstenite  = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures            = { workspace = true }
clap               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

ratatui       = { workspace = true }
crossterm     = { workspace = true }
unicode-width = { workspace = true }
similar       = { workspace = true }
regex         = { workspace = true }
base64        = "0.22"
# Syntax highlighting inside fenced code blocks. `default-fancy` uses the
# pure-Rust fancy-regex engine so we don't pull the C++ oniguruma dep.
syntect       = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile      = "3"
