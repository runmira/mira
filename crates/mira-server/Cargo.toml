[package]
name         = "mira-server"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
description  = "HTTP/WebSocket server that fronts a Mira session for browser or desktop UIs."

[dependencies]
base64       = "0.22"
sha2         = "0.10"
mira-core    = { workspace = true }
mira-cloud    = { workspace = true }
mira-ai      = { workspace = true }
mira-agents  = { workspace = true }
mira-config  = { workspace = true }
mira-engine  = { workspace = true }
mira-harness = { workspace = true }
mira-memory  = { workspace = true }
mira-policy  = { workspace = true }
mira-compute = { workspace = true }
mira-review  = { workspace = true }
mira-acp = { workspace = true }
mira-pty = { workspace = true }
mira-sandbox = { workspace = true }
mira-skills  = { workspace = true }
mira-tools   = { workspace = true }
mira-auth    = { workspace = true }
mira-browser = { workspace = true }
mira-mcp     = { workspace = true }
mira-plugins = { workspace = true }

shellexpand  = { workspace = true }
once_cell    = "1"

include_dir  = "0.7"
mime_guess   = "2"

axum         = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }

tokio        = { workspace = true }
tokio-stream = { workspace = true }
futures      = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
chrono       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }
portable-pty = "0.8"
reqwest      = { workspace = true }
# Filesystem watcher for skill hot-reload — picks up new / edited
# SKILL.md files without the user clicking Reload.
notify       = "6"
# Browser recordings: decode the live view's JPEG frames, encode a GIF.
image        = { version = "0.25", default-features = false, features = ["jpeg", "gif"] }

[dev-dependencies]
tempfile = "3"
