[package]
name = "mira-desktop"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Mira desktop app: the web UI in a native window, backed by a bundled `mira serve`."
publish = false

# Kept out of the main workspace: Tauri needs WebKitGTK/WebView2 system
# libraries, and the core crates shouldn't require them to build or test.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
