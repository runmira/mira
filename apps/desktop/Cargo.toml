[package]
name = "mira-desktop"
version = "0.5.3-alpha"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Mira desktop app: the web UI in a native window, backed by a bundled `mira serve`."
publish = false

# Kept out of the main workspace: Tauri needs WebKitGTK/WebView2 system
# libraries, and the core crates shouldn't require them to build or test.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gates `Webview::new`-style child webviews, which is how the
# browser pane renders a real, native webview inside the main window at a
# tracked rect. Electron's equivalent (WebContentsView overlay) has no
# stable Tauri equivalent, so this is the only route to an in-panel browser.
#   `unstable`      — child webviews (the browser pane's embedded browser)
#   `macos-private-api` — required for a transparent window on macOS, which is
#                     what lets `UnderWindowBackground` vibrancy show through
#                     the sidebar. Excludes Mac App Store distribution.
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# In-app updates: per-channel feed, signed bundles (see scripts/macos-signing.sh updater-key).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
