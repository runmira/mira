<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mira</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #171717;
        --muted: #737373;
        --border: #e5e5e5;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #f5f5f5;
          --muted: #a3a3a3;
          --border: #262626;
          --error: #f87171;
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main { max-width: 560px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { color: var(--muted); margin: 0; }
      .logo { width: 64px; height: 64px; border-radius: 16px; object-fit: contain; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
      #title, #detail { display: none; }
      body.failed #title, body.failed #detail { display: block; }
      pre {
        display: none; text-align: left; white-space: pre-wrap; word-break: break-word;
        margin: 16px 0 0; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--error);
        max-height: 50vh; overflow: auto; -webkit-user-select: text; user-select: text;
      }
      body.failed .logo { display: none; }
      body.failed pre { display: block; }
    </style>
  </head>
  <body data-tauri-drag-region>
    <main data-tauri-drag-region role="status" aria-label="Starting Mira">
      <img class="logo" src="mira-logo.png" alt="" draggable="false" data-tauri-drag-region />
      <h1 id="title">Starting Mira…</h1>
      <p id="detail">Launching the local server.</p>
      <pre id="error"></pre>
    </main>
    <script>
      window.miraStartupFailed = function (message) {
        document.body.classList.add('failed');
        document.getElementById('title').textContent = 'Mira couldn’t start';
        document.getElementById('detail').textContent =
          'Quit and reopen the app to try again. Details:';
        document.getElementById('error').textContent = message;
      };
    </script>
  </body>
</html>
